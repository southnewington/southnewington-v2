    <style>
* {

    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.6;
}

header {
    background: linear-gradient(
        rgba(0, 0, 0, 0.45),
        rgba(0, 0, 0, 0.45)

    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600");

nav {

    padding: 15px;
    text-align: center;

nav a {
    color: #003366;
    text-decoration: none;
    font-weight: 600;
    margin: 0 15px;
}

nav a:hover {
    color: #0078d4;
}

.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

footer {
    text-align: center;
    margin-top: 50px;
    padding: 30px;
    color: #666;
}

@media (max-width: 768px) {
    header h1 {
        font-size: 2rem;
    }

        display: block;

    }
